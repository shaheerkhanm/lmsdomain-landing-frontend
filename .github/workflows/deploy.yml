# Deploys the website with /opt/lmsdomain/deploy.sh on the server.
#   push to feature/multipage  -> staging (automatic)
#   Actions > Deploy > Run workflow -> staging or live (live promotes the staging build)
# The SSH key can only run deploy.sh (forced command on the server), nothing else.
name: Deploy

on:
  push:
    branches: [feature/multipage]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [staging, live]
        default: staging

# One deploy at a time (staging and live share the server)
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Deploy on the server
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "$TARGET" in staging|live) ;; *) echo "Unknown target: $TARGET"; exit 1 ;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "Deploying $TARGET (commit ${GITHUB_SHA::7})"
          # The server runs one deploy at a time (website and admin share it). If another
          # deploy is running, wait and try again for up to 30 minutes.
          for attempt in $(seq 1 60); do
            set +e
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "$TARGET" 2>&1 | tee /tmp/deploy.out
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] && grep -q "another deploy is running" /tmp/deploy.out; then
              echo "Another deploy is running on the server; waiting 30 seconds (attempt $attempt of 60)"
              sleep 30
              continue
            fi
            exit "$status"
          done
          echo "Gave up: the server was busy for 30 minutes"
          exit 1
