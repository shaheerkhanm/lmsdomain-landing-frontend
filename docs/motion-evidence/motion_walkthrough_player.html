    .title { font-size: 20px; font-weight: 700; color: #FFFFFF; }

    .viewport-box { position: relative; width: 100%; max-width: 1200px; aspect-ratio: 1440 / 900; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); border: 1px solid #334155; }
    .viewport-box img { width: 100%; height: 100%; object-fit: contain; }
    .overlay-info { position: absolute; bottom: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px; line-height: 1.4; }
    .overlay-info .sec { font-weight: 600; color: #C4B5FD; }
    .overlay-info .meta { color: #94A3B8; font-size: 11px; font-family: monospace; }
    .controls { width: 100%; max-width: 1200px; margin-top: 16px; background: #1E293B; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .slider-row { display: flex; align-items: center; gap: 16px; width: 100%; }
    .slider { flex: 1; height: 8px; border-radius: 4px; background: #334155; outline: none; -webkit-appearance: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #A78BFA; cursor: pointer; box-shadow: 0 0 10px #7C3AED; }
    .buttons-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-group { display: flex; gap: 8px; }
    button { background: #334155; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    button:hover { background: #475569; }
    button.primary { background: #7C3AED; }
    button.primary:hover { background: #6D28D9; }
    .status-text { font-family: monospace; font-size: 12px; color: #A78BFA; }
  </style>

    let currentIndex = 0;
    let isPlaying = false;
    let playInterval = null;
    let speed = 80;

    const img = document.getElementById('playerImg');
    const scrubber = document.getElementById('scrubber');
    const secText = document.getElementById('secText');
    const metaText = document.getElementById('metaText');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const speedBtn = document.getElementById('speedBtn');
    const statusText = document.getElementById('statusText');

    function updateFrame(idx) {
      currentIndex = Math.max(0, Math.min(frames.length - 1, idx));
      scrubber.value = currentIndex;
      img.src = 'walkthrough_frames/' + frames[currentIndex];
      secText.textContent = meta[currentIndex].section;
      metaText.textContent = 'Frame ' + (currentIndex + 1) + ' / ' + frames.length + ' • Scroll Y: ' + meta[currentIndex].y + 'px (' + meta[currentIndex].progress + ') • Direction: ' + meta[currentIndex].dir;
    }

    scrubber.addEventListener('input', (e) => {
      pause();
      updateFrame(parseInt(e.target.value, 10));
    });

    prevBtn.addEventListener('click', () => { pause(); updateFrame(currentIndex - 1); });
    nextBtn.addEventListener('click', () => { pause(); updateFrame(currentIndex + 1); });

    function play() {
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      statusText.textContent = 'Playing...';
      playInterval = setInterval(() => {
        if (currentIndex >= frames.length - 1) {
          updateFrame(0);
        } else {
          updateFrame(currentIndex + 1);
        }
      }, speed);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      statusText.textContent = 'Paused';
      if (playInterval) clearInterval(playInterval);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause(); else play();
    });

    speedBtn.addEventListener('click', () => {
      if (speed === 80) { speed = 40; speedBtn.textContent = 'Speed: 2x'; }
      else if (speed === 40) { speed = 160; speedBtn.textContent = 'Speed: 0.5x'; }
      else { speed = 80; speedBtn.textContent = 'Speed: 1x'; }
      if (isPlaying) { pause(); play(); }
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) pause(); else play();
      } else if (e.key === 'ArrowRight') {
        pause(); updateFrame(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        pause(); updateFrame(currentIndex - 1);
      }
    });
